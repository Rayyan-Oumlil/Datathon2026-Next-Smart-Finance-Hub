[project]
name = "datathon-agent"
version = "0.1.0"
description = "Agent service: orchestrator + subagents on Strands, served through BedrockAgentCoreApp"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.30",
    "bedrock-agentcore>=1.0",
    "boto3>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "botocore[crt]"]  # crt: needed by `aws login` credentials on a laptop
otel = ["aws-opentelemetry-distro>=0.18.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
